<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Maturity Project</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F8F6F1;
    --sage: #A8B5A0;
    --sage-light: #C8D4C2;
    --sage-pale: #E8EDE5;
    --blue-muted: #8FA3B0;
    --blue-light: #B8C8D2;
    --blue-pale: #E0E8ED;
    --gold-soft: #C4A96A;
    --text-primary: #2C3E2D;
    --text-secondary: #5A6B5C;
    --text-light: #8A9A8C;
    --white: #FFFFFF;
    --divider: rgba(168, 181, 160, 0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    overflow-x: hidden;
  }

  body {
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 300;
    color: var(--text-primary);
    background: var(--cream);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
  }

  .reveal {
    opacity: 0;
    transform: translateY(32px);
    transition: opacity 0.9s cubic-bezier(0.23, 1, 0.32, 1),
                transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .reveal-delay-1 { transition-delay: 0.12s; }
  .reveal-delay-2 { transition-delay: 0.24s; }
  .reveal-delay-3 { transition-delay: 0.36s; }
  .reveal-delay-4 { transition-delay: 0.48s; }

  nav {
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 100;
    padding: 1.5rem 3rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.5s, box-shadow 0.5s;
  }
  nav.scrolled {
    background: rgba(248, 246, 241, 0.92);
    backdrop-filter: blur(12px);
    box-shadow: 0 1px 0 var(--divider);
  }
  .nav-brand {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 1.15rem;
    letter-spacing: 0.08em;
    color: var(--text-primary);
    text-decoration: none;
  }
  .nav-links {
    display: flex;
    gap: 2.5rem;
    list-style: none;
  }
  .nav-links a {
    font-size: 0.78rem;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.3s;
    position: relative;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 1px;
    background: var(--sage);
    transition: width 0.3s;
  }
  .nav-links a:hover { color: var(--text-primary); }
  .nav-links a:hover::after { width: 100%; }

  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 2rem;
    position: relative;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(168, 181, 160, 0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(143, 163, 176, 0.12) 0%, transparent 60%),
      var(--cream);
    z-index: 0;
  }
  .hero-content {
    position: relative;
    z-index: 1;
    max-width: 700px;
  }
  .hero-eyebrow {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 1.5rem;
    opacity: 0;
    animation: fadeUp 1s 0.3s cubic-bezier(0.23, 1, 0.32, 1) forwards;
  }
  .hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(2.8rem, 6vw, 4.5rem);
    line-height: 1.15;
    color: var(--text-primary);
    margin-bottom: 1.5rem;
    opacity: 0;
    animation: fadeUp 1s 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
  }
  .hero h1 em {
    font-style: italic;
    color: var(--sage);
  }
  .hero-scripture {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 1.1rem;
    color: var(--text-light);
    max-width: 480px;
    margin: 0 auto 2.5rem;
    opacity: 0;
    animation: fadeUp 1s 0.7s cubic-bezier(0.23, 1, 0.32, 1) forwards;
  }
  .hero-cta {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-primary);
    text-decoration: none;
    padding: 0.9rem 2.2rem;
    border: 1px solid var(--sage);
    border-radius: 100px;
    transition: all 0.4s;
    opacity: 0;
    animation: fadeUp 1s 0.9s cubic-bezier(0.23, 1, 0.32, 1) forwards;
  }
  .hero-cta:hover {
    background: var(--sage);
    color: var(--white);
  }
  .hero-cta svg {
    width: 14px;
    height: 14px;
    transition: transform 0.3s;
  }
  .hero-cta:hover svg { transform: translateY(3px); }

  .growth-line {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 1px;
    height: 0;
    background: linear-gradient(to bottom, transparent, var(--sage-light));
    animation: growLine 2s 1.2s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    z-index: 1;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes growLine {
    from { height: 0; }
    to { height: 80px; }
  }

  section {
    padding: 7rem 3rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  .section-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 1rem;
  }
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(2rem, 4vw, 2.8rem);
    line-height: 1.25;
    color: var(--text-primary);
    margin-bottom: 1.5rem;
  }
  .section-body {
    font-size: 1.02rem;
    color: var(--text-secondary);
    max-width: 600px;
    line-height: 1.85;
  }

  .about {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: center;
  }
  .about-visual {
    position: relative;
    height: 400px;
    border-radius: 16px;
    overflow: hidden;
    background:
      linear-gradient(135deg, var(--sage-pale) 0%, var(--blue-pale) 100%);
  }
  .about-visual-inner {
    position: absolute;
    inset: 2rem;
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .about-visual-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-style: italic;
    color: var(--text-secondary);
    text-align: center;
    padding: 1.5rem;
    opacity: 0.7;
  }

  .journey-section {
    padding: 7rem 3rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  .journey-header {
    text-align: center;
    margin-bottom: 5rem;
  }
  .journey-stages {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2rem;
    position: relative;
  }
  .journey-stages::before {
    content: '';
    position: absolute;
    top: 40px;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--sage-light), transparent);
  }
  .stage-card {
    text-align: center;
    padding: 2rem 1rem;
    position: relative;
  }
  .stage-number {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    font-weight: 500;
    position: relative;
    z-index: 1;
  }
  .stage-1 .stage-number { background: var(--sage-pale); color: var(--sage); }
  .stage-2 .stage-number { background: var(--sage-pale); color: var(--sage); }
  .stage-3 .stage-number { background: var(--blue-pale); color: var(--blue-muted); }
  .stage-4 .stage-number { background: var(--blue-pale); color: var(--blue-muted); }
  .stage-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 1.25rem;
    color: var(--text-primary);
    margin-bottom: 0.75rem;
  }
  .stage-desc {
    font-size: 0.88rem;
    color: var(--text-light);
    line-height: 1.7;
  }

  .commissions-section {
    padding: 7rem 3rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  .commissions-header {
    margin-bottom: 4rem;
  }
  .commissions-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
  }
  .commission-card {
    background: var(--white);
    border-radius: 16px;
    padding: 2.5rem 2rem;
    border: 1px solid rgba(168, 181, 160, 0.15);
    transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1),
                box-shadow 0.4s;
  }
  .commission-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(44, 62, 45, 0.06);
  }
  .commission-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.25rem;
    font-size: 1.2rem;
  }
  .commission-icon.sage { background: var(--sage-pale); }
  .commission-icon.blue { background: var(--blue-pale); }
  .commission-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 1.2rem;
    color: var(--text-primary);
    margin-bottom: 0.6rem;
  }
  .commission-card p {
    font-size: 0.88rem;
    color: var(--text-light);
    line-height: 1.7;
  }

  .members-section {
    padding: 7rem 3rem;
    max-width: 1100px;
    margin: 0 auto;
    text-align: center;
  }
  .members-header {
    margin-bottom: 4rem;
  }
  .members-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2rem;
    max-width: 800px;
    margin: 0 auto;
  }
  .member-avatar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
  }
  .member-circle {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 1.1rem;
    color: var(--white);
    transition: transform 0.3s;
  }
  .member-circle:hover { transform: scale(1.1); }
  .member-name {
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--text-light);
    letter-spacing: 0.02em;
  }

  .schedule-section {
    padding: 7rem 3rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  .schedule-layout {
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 4rem;
    align-items: start;
  }
  .schedule-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .schedule-item {
    background: var(--white);
    border-radius: 12px;
    padding: 1.5rem;
    border: 1px solid rgba(168, 181, 160, 0.12);
    display: flex;
    gap: 1.25rem;
    align-items: flex-start;
    transition: box-shadow 0.3s;
  }
  .schedule-item:hover {
    box-shadow: 0 4px 20px rgba(44, 62, 45, 0.05);
  }
  .schedule-date {
    min-width: 48px;
    text-align: center;
  }
  .schedule-date .day {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1;
  }
  .schedule-date .month {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--sage);
  }
  .schedule-info h4 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 1.05rem;
    color: var(--text-primary);
    margin-bottom: 0.25rem;
  }
  .schedule-info p {
    font-size: 0.82rem;
    color: var(--text-light);
  }

  .leadership-section {
    padding: 7rem 3rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  .leadership-header {
    text-align: center;
    margin-bottom: 4rem;
  }
  .leadership-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2rem;
    max-width: 800px;
    margin: 0 auto;
  }
  .leader-card {
    text-align: center;
    padding: 2rem 1rem;
  }
  .leader-photo {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    margin: 0 auto 1.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.8rem;
    font-weight: 400;
    color: var(--white);
  }
  .leader-card h3 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 1.15rem;
    color: var(--text-primary);
    margin-bottom: 0.3rem;
  }
  .leader-card .role {
    font-size: 0.78rem;
    font-weight: 400;
    color: var(--sage);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .connect-section {
    padding: 7rem 3rem 5rem;
    max-width: 1100px;
    margin: 0 auto;
    text-align: center;
  }
  .connect-box {
    background: linear-gradient(135deg, var(--sage-pale) 0%, var(--blue-pale) 100%);
    border-radius: 24px;
    padding: 5rem 3rem;
    position: relative;
    overflow: hidden;
  }
  .connect-box::before {
    content: '';
    position: absolute;
    inset: 1px;
    border-radius: 23px;
    background: rgba(248, 246, 241, 0.55);
    z-index: 0;
  }
  .connect-box > * { position: relative; z-index: 1; }
  .connect-box .section-title {
    margin-bottom: 1rem;
  }
  .connect-box .section-body {
    max-width: 480px;
    margin: 0 auto 2rem;
    text-align: center;
  }
  .connect-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 1rem 2.4rem;
    background: var(--text-primary);
    color: var(--cream);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: none;
    border-radius: 100px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s;
  }
  .connect-btn:hover {
    background: var(--sage);
    transform: translateY(-2px);
  }

  footer {
    padding: 3rem;
    text-align: center;
    border-top: 1px solid var(--divider);
    max-width: 1100px;
    margin: 0 auto;
  }
  footer p {
    font-size: 0.78rem;
    color: var(--text-light);
    letter-spacing: 0.04em;
  }
  footer .footer-scripture {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--text-light);
    margin-bottom: 1rem;
  }

  .section-divider {
    width: 48px;
    height: 1px;
    background: var(--sage-light);
    margin: 0 auto;
  }
  .section-divider.left {
    margin: 0;
  }

  @media (max-width: 900px) {
    nav { padding: 1.2rem 1.5rem; }
    .nav-links { gap: 1.5rem; }
    section, .journey-section, .commissions-section,
    .members-section, .schedule-section,
    .leadership-section, .connect-section { padding: 5rem 1.5rem; }
    .about { grid-template-columns: 1fr; gap: 2.5rem; }
    .about-visual { height: 280px; }
    .journey-stages { grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
    .journey-stages::before { display: none; }
    .commissions-grid { grid-template-columns: 1fr; }
    .schedule-layout { grid-template-columns: 1fr; gap: 2.5rem; }
    .leadership-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .nav-links { display: none; }
    .hero h1 { font-size: 2.4rem; }
    .journey-stages { grid-template-columns: 1fr; }
    .leadership-grid { grid-template-columns: 1fr; }
    .connect-box { padding: 3rem 1.5rem; }
  }
</style>
</head>
<body>

<!-- Navigation -->
<nav id="mainNav">
  <a href="#" class="nav-brand">The Maturity Project</a>
  <ul class="nav-links">
    <li><a href="#about">About</a></li>
    <li><a href="#journey">Journey</a></li>
    <li><a href="#commissions">Commissions</a></li>
    <li><a href="#schedule">Schedule</a></li>
    <li><a href="#leadership">Leadership</a></li>
    <li><a href="#connect">Connect</a></li>
  </ul>
</nav>

<!-- Hero -->
<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <p class="hero-eyebrow" id="heroEyebrow"></p>
    <h1 id="heroHeadline"></h1>
    <p class="hero-scripture" id="heroScripture"></p>
    <a href="#about" class="hero-cta" id="heroCta">
      <span id="heroCtaText"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M19 12l-7 7-7-7"/>
      </svg>
    </a>
  </div>
  <div class="growth-line"></div>
</section>

<!-- About -->
<section id="about">
  <div class="about">
    <div>
      <p class="section-label reveal" id="aboutLabel"></p>
      <h2 class="section-title reveal reveal-delay-1" id="aboutTitle"></h2>
      <div class="section-divider left reveal reveal-delay-2" style="margin-bottom: 1.5rem;"></div>
      <div id="aboutBody"></div>
    </div>
    <div class="about-visual reveal reveal-delay-2">
      <div class="about-visual-inner">
        <p class="about-visual-text" id="aboutVisualText"></p>
      </div>
    </div>
  </div>
</section>

<!-- Journey -->
<section class="journey-section" id="journey">
  <div class="journey-header">
    <p class="section-label reveal" id="journeyLabel"></p>
    <h2 class="section-title reveal reveal-delay-1" id="journeyTitle"></h2>
    <div class="section-divider reveal reveal-delay-2"></div>
  </div>
  <div class="journey-stages" id="journeyStages"></div>
</section>

<!-- Commissions -->
<section class="commissions-section" id="commissions">
  <div class="commissions-header">
    <p class="section-label reveal" id="commissionsLabel"></p>
    <h2 class="section-title reveal reveal-delay-1" id="commissionsTitle"></h2>
    <p class="section-body reveal reveal-delay-2" id="commissionsBody"></p>
  </div>
  <div class="commissions-grid" id="commissionsGrid"></div>
</section>

<!-- Members -->
<section class="members-section" id="members">
  <div class="members-header">
    <p class="section-label reveal" id="membersLabel"></p>
    <h2 class="section-title reveal reveal-delay-1" id="membersTitle"></h2>
    <div class="section-divider reveal reveal-delay-2"></div>
  </div>
  <div class="members-grid reveal reveal-delay-2" id="membersGrid"></div>
</section>

<!-- Schedule -->
<section class="schedule-section" id="schedule">
  <div class="schedule-layout">
    <div>
      <p class="section-label reveal" id="scheduleLabel"></p>
      <h2 class="section-title reveal reveal-delay-1" id="scheduleTitle"></h2>
      <div class="section-divider left reveal reveal-delay-2" style="margin-bottom: 1.5rem;"></div>
      <p class="section-body reveal reveal-delay-2" id="scheduleBody"></p>
    </div>
    <div class="schedule-list" id="scheduleList"></div>
  </div>
</section>

<!-- Leadership -->
<section class="leadership-section" id="leadership">
  <div class="leadership-header">
    <p class="section-label reveal" id="leadershipLabel"></p>
    <h2 class="section-title reveal reveal-delay-1" id="leadershipTitle"></h2>
    <div class="section-divider reveal reveal-delay-2"></div>
  </div>
  <div class="leadership-grid" id="leadershipGrid"></div>
</section>

<!-- Connect -->
<section class="connect-section" id="connect">
  <div class="connect-box reveal">
    <p class="section-label" id="connectLabel"></p>
    <h2 class="section-title" id="connectTitle"></h2>
    <p class="section-body" id="connectBody"></p>
    <a href="#" class="connect-btn" id="connectBtn">
      <span id="connectBtnText"></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </div>
</section>

<!-- Footer -->
<footer>
  <p class="footer-scripture" id="footerScripture"></p>
  <p id="footerCopyright"></p>
</footer>

<script>
  const COLOR_MAP = {
    'sage': 'var(--sage)',
    'sage-light': 'var(--sage-light)',
    'blue-muted': 'var(--blue-muted)',
    'blue-light': 'var(--blue-light)',
    'gold-soft': 'var(--gold-soft)'
  };

  const GRADIENT_MAP = {
    'sage-to-sage-light': 'linear-gradient(135deg, var(--sage), var(--sage-light))',
    'blue-muted-to-blue-light': 'linear-gradient(135deg, var(--blue-muted), var(--blue-light))',
    'sage-to-blue-muted': 'linear-gradient(135deg, var(--sage), var(--blue-muted))',
    'sage-to-gold-soft': 'linear-gradient(135deg, var(--sage), var(--gold-soft))',
    'blue-muted-to-gold-soft': 'linear-gradient(135deg, var(--blue-muted), var(--gold-soft))'
  };

  // Scroll reveal observer
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

  function observeReveals() {
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  }

  // Nav scroll effect
  window.addEventListener('scroll', () => {
    document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 60);
  });

  // Smooth scroll
  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const target = document.querySelector(a.getAttribute('href'));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  // Load and render content
  async function loadContent() {
    const res = await fetch('/api/content');
    const data = await res.json();

    // Hero
    document.getElementById('heroEyebrow').textContent = data.hero.eyebrow;
    document.getElementById('heroHeadline').innerHTML = data.hero.headline;
    const scriptureEl = document.getElementById('heroScripture');
    scriptureEl.innerHTML = data.hero.scripture + '<br>' + data.hero.scriptureRef;
    document.getElementById('heroCtaText').textContent = data.hero.ctaText;

    // About
    document.getElementById('aboutLabel').textContent = data.about.label;
    document.getElementById('aboutTitle').innerHTML = data.about.title;
    const aboutBodyEl = document.getElementById('aboutBody');
    aboutBodyEl.innerHTML = data.about.body.map((p, i) =>
      `<p class="section-body reveal reveal-delay-${i + 2}" ${i > 0 ? 'style="margin-top: 1rem;"' : ''}>${p}</p>`
    ).join('');
    document.getElementById('aboutVisualText').innerHTML = data.about.visualText;

    // Journey
    document.getElementById('journeyLabel').textContent = data.journey.label;
    document.getElementById('journeyTitle').textContent = data.journey.title;
    const stagesEl = document.getElementById('journeyStages');
    stagesEl.innerHTML = data.journey.stages.map((s, i) => `
      <div class="stage-card stage-${i + 1} reveal ${i > 0 ? 'reveal-delay-' + i : ''}">
        <div class="stage-number">${s.number}</div>
        <h3 class="stage-title">${s.title}</h3>
        <p class="stage-desc">${s.description}</p>
      </div>
    `).join('');

    // Commissions
    document.getElementById('commissionsLabel').textContent = data.commissions.label;
    document.getElementById('commissionsTitle').textContent = data.commissions.title;
    document.getElementById('commissionsBody').textContent = data.commissions.body;
    const commGrid = document.getElementById('commissionsGrid');
    commGrid.innerHTML = data.commissions.cards.map((c, i) => `
      <div class="commission-card reveal ${i > 0 ? 'reveal-delay-' + Math.min(i, 4) : ''}">
        <div class="commission-icon ${c.iconColor}">${c.icon}</div>
        <h3>${c.title}</h3>
        <p>${c.description}</p>
      </div>
    `).join('');

    // Members
    document.getElementById('membersLabel').textContent = data.members.label;
    document.getElementById('membersTitle').textContent = data.members.title;
    const membersGrid = document.getElementById('membersGrid');
    membersGrid.innerHTML = data.members.list.map(m => `
      <div class="member-avatar">
        <div class="member-circle" style="background: ${COLOR_MAP[m.color] || 'var(--sage)'}">
          ${m.name[0]}
        </div>
        <span class="member-name">${m.name}</span>
      </div>
    `).join('');

    // Schedule
    document.getElementById('scheduleLabel').textContent = data.schedule.label;
    document.getElementById('scheduleTitle').innerHTML = data.schedule.title;
    document.getElementById('scheduleBody').textContent = data.schedule.body;
    const schedList = document.getElementById('scheduleList');
    schedList.innerHTML = data.schedule.events.map((ev, i) => `
      <div class="schedule-item reveal ${i > 0 ? 'reveal-delay-' + i : ''}">
        <div class="schedule-date">
          <div class="day">${ev.day}</div>
          <div class="month">${ev.month}</div>
        </div>
        <div class="schedule-info">
          <h4>${ev.title}</h4>
          <p>${ev.details}</p>
        </div>
      </div>
    `).join('');

    // Leadership
    document.getElementById('leadershipLabel').textContent = data.leadership.label;
    document.getElementById('leadershipTitle').textContent = data.leadership.title;
    const leadGrid = document.getElementById('leadershipGrid');
    leadGrid.innerHTML = data.leadership.leaders.map((l, i) => `
      <div class="leader-card reveal ${i > 0 ? 'reveal-delay-' + i : ''}">
        <div class="leader-photo" style="background: ${GRADIENT_MAP[l.gradient] || GRADIENT_MAP['sage-to-sage-light']}">
          &#x271D;
        </div>
        <h3>${l.name}</h3>
        <p class="role">${l.role}</p>
      </div>
    `).join('');

    // Connect
    document.getElementById('connectLabel').textContent = data.connect.label;
    document.getElementById('connectTitle').innerHTML = data.connect.title;
    document.getElementById('connectBody').textContent = data.connect.body;
    document.getElementById('connectBtnText').textContent = data.connect.buttonText;
    document.getElementById('connectBtn').href = 'mailto:' + data.connect.email;

    // Footer
    const footerScr = document.getElementById('footerScripture');
    footerScr.textContent = data.footer.scripture + ' ' + data.footer.scriptureRef;
    document.getElementById('footerCopyright').textContent = data.footer.copyright;

    // Re-observe newly created elements
    observeReveals();
  }

  loadContent();
</script>

</body>
</html>
